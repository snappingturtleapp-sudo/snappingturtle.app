<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Track Your Order | SnappingTurtle — Photo Gifts by Mail</title>
<style>
  :root {
    --black: #0A0A08;
    --green: #C8E620;
    --cream: #F5E9C8;
    --brown: #9A8A72;
    --dim: #6B5830;
    --border: #3A3020;
    --red: #CC2200;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--black); color: var(--cream); font-family: monospace; min-height: 100vh; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 40px; border-bottom: 1px solid var(--border);
    background: rgba(10,10,8,0.97); backdrop-filter: blur(8px);
  }
  .nav-logo { color: var(--green); font-size: 12px; letter-spacing: 4px; text-decoration: none; }

  .wrap { max-width: 520px; margin: 0 auto; padding: 110px 24px 100px; }
  .eyebrow { color: var(--green); font-size: 10px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 14px; }
  h1 { font-size: clamp(24px, 4vw, 32px); font-weight: bold; margin-bottom: 10px; letter-spacing: 0.5px; }
  .sub { color: var(--brown); font-size: 13px; line-height: 22px; margin-bottom: 32px; font-style: italic; }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 10px; color: var(--green); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .field input {
    width: 100%; background: #1A1A18; border: 1px solid var(--border);
    color: var(--cream); padding: 13px 14px; font-size: 14px; font-family: monospace;
  }
  .field input:focus { outline: none; border-color: var(--green); }

  .btn { display: block; width: 100%; background: var(--red); color: var(--cream); padding: 16px; font-size: 13px; letter-spacing: 3px; font-weight: bold; font-family: monospace; cursor: pointer; border: none; text-align: center; text-transform: uppercase; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-ghost { display: block; width: 100%; background: transparent; color: var(--green); border: 1px solid var(--green); padding: 14px; font-size: 12px; letter-spacing: 2px; font-weight: bold; font-family: monospace; cursor: pointer; text-align: center; text-transform: uppercase; text-decoration: none; margin-top: 12px; }
  .btn-ghost:hover { opacity: 0.85; }

  .error-banner { border-left: 2px solid var(--red); padding-left: 14px; font-size: 13px; color: var(--cream); margin-bottom: 20px; display: none; }

  .status-card { border: 1px solid var(--border); padding: 24px; margin-top: 20px; }
  .status-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .status-row:last-child { border-bottom: none; }
  .status-row .label { color: var(--brown); }
  .status-badge { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; padding: 3px 10px; border: 1px solid var(--brown); color: var(--brown); }
  .status-badge.shipped { border-color: var(--green); color: var(--green); }
  .track-link { display: block; text-align: center; color: var(--green); text-decoration: underline; margin-top: 18px; font-size: 13px; }

  .state-message { text-align: center; padding: 60px 0; }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">✦ SNAPPINGTURTLE ✦</a>
  <a href="/" style="font-size:10px; letter-spacing:2px; color:var(--cream); text-transform:uppercase;">Home</a>
</nav>

<div style="display: none; tab-index: -1;" aria-hidden="true">
  <label for="website_secondary">Secondary Security Check Item Fields</label>
  <input type="text" id="website_secondary" name="website_secondary" autocomplete="off" oninput="interceptBillboardBotAttack()">
</div>
<script>
let landingClickTimestamps = [];
document.addEventListener("DOMContentLoaded", () => {
    window.addEventListener("click", () => {
        const now = Date.now();
        landingClickTimestamps.push(now);
        landingClickTimestamps = landingClickTimestamps.filter(t => now - t < 5000);
        if (landingClickTimestamps.length > 20) {
            alert("Rapid interaction threshold exceeded. Protective security cooldown active.");
            window.location.href = "https://snappingturtle.app";
        }
    });
});
function interceptBillboardBotAttack() {
    const triggerVal = document.getElementById("website_secondary").value;
    if (triggerVal) {
        console.warn("⚠️ Bot screening triggered on static landing node. Evacuating browser context.");
        window.location.href = "https://snappingturtle.app";
    }
}
</script>

<div class="wrap" id="app">
  <p class="eyebrow">Track Your Order</p>
  <h1>Where's my package?</h1>
  <p class="sub">Enter the order number shown on your confirmation screen. Bookmark this page to check back anytime.</p>

  <div class="error-banner" id="error-banner"></div>

  <div class="field">
    <label for="order-input">Order Number</label>
    <input type="text" id="order-input" placeholder="ST-1234567890123" autocomplete="off" />
  </div>

  <button class="btn" id="track-btn">Check Status</button>
</div>

<script>
const BACKEND_URL = 'https://snappingturtle-backend-production.up.railway.app';
const params = new URLSearchParams(window.location.search);
const app = document.getElementById('app');
const prefillOrderId = params.get('orderId');

function renderNotFound() {
  app.innerHTML = `
    <div class="state-message">
      <h1>We couldn't find that order.</h1>
      <p class="sub" style="margin-top:12px;">Double-check the order number and try again — it should look like ST-1234567890123.</p>
      <a class="btn-ghost" href="/track.html" style="margin-top:24px;">Try Again</a>
      <a class="btn-ghost" href="/feedback.html">Still stuck? Send us a note →</a>
    </div>`;
}

function renderStatus(data, orderId) {
  const isShipped = !!data.shipped;
  app.innerHTML = `
    <p class="eyebrow">Track Your Order</p>
    <h1>${orderId}</h1>
    <div class="status-card">
      <div class="status-row">
        <span class="label">Status</span>
        <span class="status-badge ${isShipped ? 'shipped' : ''}">${isShipped ? 'Shipped' : 'Processing'}</span>
      </div>
      ${!isShipped ? `<div class="status-row"><span class="label">Note</span><span>${data.message || 'Your order is being printed and prepared for shipment.'}</span></div>` : ''}
    </div>
    ${isShipped && data.tracking_url ? `<a class="track-link" href="${data.tracking_url}" target="_blank" rel="noopener">View live tracking on the carrier's site →</a>` : ''}
    <a class="btn-ghost" href="/track.html" style="margin-top:24px;">Check Another Order</a>
  `;
}

async function checkOrder(orderId) {
  const errorBanner = document.getElementById('error-banner');
  if (errorBanner) errorBanner.style.display = 'none';
  try {
    const res = await fetch(`${BACKEND_URL}/order-status/${encodeURIComponent(orderId)}`);
    if (!res.ok) {
      renderNotFound();
      return;
    }
    const data = await res.json();
    if (data.error) {
      renderNotFound();
      return;
    }
    renderStatus(data, orderId);
  } catch (err) {
    app.innerHTML = `<div class="state-message"><h1>Something went wrong.</h1><p class="sub" style="margin-top:12px;">Please try again in a moment.</p></div>`;
  }
}

document.getElementById('track-btn').addEventListener('click', () => {
  const orderId = document.getElementById('order-input').value.trim();
  const errorBanner = document.getElementById('error-banner');
  if (!orderId) {
    errorBanner.textContent = 'Please enter your order number.';
    errorBanner.style.display = 'block';
    return;
  }
  checkOrder(orderId);
});

if (prefillOrderId) {
  checkOrder(prefillOrderId);
}
</script>

</body>
</html>
